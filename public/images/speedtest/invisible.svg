<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <defs>
    <style>
      .bg { fill: #131416; }
      .border { stroke: #252830; stroke-width: 1; fill: none; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .date { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #999ca3; text-anchor: end; }
      .node-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; fill: #f1f2f4; }
      .latency { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14.5px; text-anchor: end; }
      .speed { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14.5px; font-weight: 700; fill: #ffffff; text-anchor: end; }
      .line { stroke: #20232a; stroke-width: 1; }
      .notice { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #7b808a; }
      .brand-src { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #525660; text-anchor: end; }
    </style>
  </defs>

  <!-- 外框背景 -->
  <rect x="0.5" y="0.5" width="879" height="429" rx="12" class="bg" />
  <rect x="0.5" y="0.5" width="879" height="429" rx="12" class="border" />

  <!-- 头部：品牌标题与实测日期 -->
  <text x="28" y="44" class="title">隐形人 测速报告</text>
  <text x="852" y="44" class="date">2026年10月28日 客户端节点延迟测试</text>
  <line x1="28" y1="62" x2="852" y2="62" class="line" />

  
  <!-- 节点 1：香港 HK 01–06 节点（原生IP） -->
  <text x="28" y="104" class="node-name">香港 HK 01–06 节点（原生IP）</text>
  <text x="690" y="104" class="latency" style="fill: #cbd5e1;">延迟 23–27ms</text>
  <text x="852" y="104" class="speed">IEPL专线</text>
  <line x1="28" y1="124" x2="852" y2="124" class="line" />

  <!-- 节点 2：台湾 台北 01–05 节点（原生IEPL） -->
  <text x="28" y="162" class="node-name">台湾 台北 01–05 节点（原生IEPL）</text>
  <text x="690" y="162" class="latency" style="fill: #cbd5e1;">延迟 40–43ms</text>
  <text x="852" y="162" class="speed">IEPL专线</text>
  <line x1="28" y1="182" x2="852" y2="182" class="line" />

  <!-- 节点 3：台湾 台北 06 节点 -->
  <text x="28" y="220" class="node-name">台湾 台北 06 节点</text>
  <text x="690" y="220" class="latency" style="fill: #ef4444;">延迟 Timeout</text>
  <text x="852" y="220" class="speed">IEPL专线</text>
  <line x1="28" y1="240" x2="852" y2="240" class="line" />

  <!-- 节点 4：新加坡 SG 01–04 节点（极佳伪装） -->
  <text x="28" y="278" class="node-name">新加坡 SG 01–04 节点（极佳伪装）</text>
  <text x="690" y="278" class="latency" style="fill: #cbd5e1;">延迟 40–44ms</text>
  <text x="852" y="278" class="speed">IEPL专线</text>
  <line x1="28" y1="298" x2="852" y2="298" class="line" />

  <!-- 节点 5：日本 东京 01–04 节点（原生住宅） -->
  <text x="28" y="336" class="node-name">日本 东京 01–04 节点（原生住宅）</text>
  <text x="690" y="336" class="latency" style="fill: #cbd5e1;">延迟 52–56ms</text>
  <text x="852" y="336" class="speed">IEPL专线</text>
  <line x1="28" y1="356" x2="852" y2="356" class="line" />

  <!-- 底部说明与来源 -->
  <text x="28" y="386" class="notice">数据来源于 2026-10-28 隐形人客户端内的节点延迟测试（家庭宽带，非晚高峰）。当次台湾台北 06 节点显示 Timeout，如实记录；每个人的实际速度与延迟会因所在地区、网络运营商和使用时段而不同。</text>
  <text x="852" y="412" class="brand-src">国际版VIP · 实测数据归档</text>
</svg>